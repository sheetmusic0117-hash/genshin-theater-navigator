<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>幻想真境劇詩規劃器</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--mut:#777;--line:#ddd7c8;--acc:#7a5af8;--warn:#c0392b;--ok:#2e8b57;
--pyro:#e5533d;--hydro:#2f7fd1;--electro:#a05bd8;--cryo:#4fb7d6;--anemo:#27a98a;--geo:#c99a2e;--dendro:#6aa83a}
@media(prefers-color-scheme:dark){:root{--bg:#17161b;--card:#222128;--ink:#eee;--mut:#9a98a5;--line:#383540}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,"Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:16px;margin:0 12px 0 0}
button,select,input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button.on,button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.sm{padding:1px 6px;font-size:12px}
main{padding:16px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 1px;border-radius:14px;border:1px solid var(--line);font-size:13px;margin:2px;vertical-align:middle}
.chip img,.chip .noimg{width:24px;height:24px;border-radius:50%;object-fit:cover}
.chip.bad{border-color:var(--warn);color:var(--warn)}
.chip x{cursor:pointer;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.noimg{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
.mut{color:var(--mut)}.warn{color:var(--warn)}.ok{color:var(--ok)}
.boss{border-left:4px solid var(--warn)}.arc{border-left:4px solid var(--acc)}
h3{margin:0 0 6px;font-size:15px}h4{margin:8px 0 2px;font-size:13px;color:var(--mut)}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:160px;font-family:monospace;font-size:12px}
.hide{display:none}
/* 元素分組頭像格 */
.elgrp{margin:6px 0 10px}.elgrp>.eh{font-weight:600;display:flex;gap:6px;align-items:center;margin-bottom:4px}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.av{width:78px;text-align:center;font-size:12px;cursor:pointer;border:2px solid transparent;border-radius:10px;padding:3px;position:relative;background:var(--card)}
.av img,.av .noimg{width:60px;height:60px;border-radius:10px;object-fit:cover;display:block;margin:auto}
.av.r5 img{background:linear-gradient(#b0753a,#e3a65a)}.av.r4 img{background:linear-gradient(#6d5a9e,#a787d6)}
.av.sel{border-color:var(--acc)}.av.dim{opacity:.35}
.av .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av .bdg{position:absolute;top:2px;right:2px;background:var(--acc);color:#fff;border-radius:8px;font-size:10px;padding:0 4px}
.pc{width:96px;cursor:default}.pc .lc{display:grid;grid-template-columns:auto 1fr;gap:2px 4px;align-items:center;margin-top:2px;text-align:left}
.pc .lc input{width:100%;min-width:0;padding:0 3px;font-size:11px}.pc .lc input:disabled{opacity:.6}
.pc .ck{position:absolute;top:4px;left:4px}
#modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#modal.hide{display:none}
.av .tg{font-size:10px;color:var(--acc)}
.av .bdg.s2{background:var(--ok)}.av .bdg.s1{background:#d68910}.av .bdg.s0{background:#888}
small.s2{color:var(--ok)}small.s1{color:#d68910}small.s0{color:var(--mut)}
.pc{cursor:pointer}.pc.lk{cursor:not-allowed}.pc .px{position:absolute;top:2px;right:6px;cursor:pointer;color:var(--mut)}
.avs.mini .av{width:60px;font-size:11px;padding:2px}.avs.mini .av img,.avs.mini .av .noimg{width:44px;height:44px}
details.stp{margin-top:8px;border-top:1px dashed var(--line);padding-top:4px}details.stp summary{cursor:pointer;color:var(--mut);font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
.slot.cond{flex-direction:column;gap:2px;border-style:dashed;border-color:var(--acc);color:var(--ink);font-size:12px;background:rgba(122,90,248,.08)}
.slot.cond .ci{font-size:20px;display:flex}.slot.cond .ci .dot{width:16px;height:16px}.slot.cond .ct{font-size:12px}
.condrow{margin:6px 0;gap:4px}
.cw{display:contents}
.jump{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}.chip.jump:hover,.jump:hover{color:var(--acc)}
@keyframes flashbg{0%,60%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:0 0 0 0 transparent}}.flash{animation:flashbg 1.6s ease-out;border-radius:10px}
.slot .ctag{position:absolute;left:0;right:0;bottom:0;background:rgba(122,90,248,.85);color:#fff;font-size:11px;text-align:center;padding:1px 0;z-index:1}
.ctag2{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;background:rgba(122,90,248,.2);color:var(--acc);margin-left:4px}
.genline{font-size:12px;margin-top:2px}
.condimg{width:60px;height:60px;border-radius:10px;border:2px dashed var(--acc);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--acc);background:rgba(122,90,248,.08)}
.condimg .dot{width:22px;height:22px}.avs.four .condimg{width:100%;height:auto;aspect-ratio:1}
.cbadge{position:absolute;top:3px;right:3px;background:var(--acc);color:#fff;border-radius:8px;font-size:11px;padding:0 4px;font-weight:700}.cbadge:empty{display:none}
.rrrow{margin-top:6px;font-size:13px}
.sq.evt .evv{font-size:11px;color:var(--ink);margin-top:3px;line-height:1.3}.sq.evt.best{border:2px solid var(--ok)}
.resrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.res{border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:96px;background:rgba(122,90,248,.06)}
.res .rl{font-size:12px;color:var(--mut)}.res .rv{font-size:18px;font-weight:700;line-height:1.3}.res .rs{font-size:11px;color:var(--mut)}
.card.warn{border-color:var(--warn)}
table.goals td,table.goals th{font-size:13px}table.goals tr.top td{background:rgba(46,139,87,.12);font-weight:600}
/* 實戰頁：方格一行 6 格、字跟著放大；狀態頭像用和規劃頁相同的絕對大小 */
#tab-live .sqgrid{grid-template-columns:repeat(6,1fr)}
#tab-live .sq{font-size:18px;padding:8px 6px;gap:4px}
#tab-live .sq .sqi{font-size:34px;min-height:38px}#tab-live .sq .sqi .dot{width:24px;height:24px}
#tab-live .sq .sqt{font-weight:600;line-height:1.25}#tab-live .sq .sqs{font-size:14px}
#tab-live .sq.evt .evv{font-size:16px;margin-top:4px;line-height:1.35}
#tab-live .avs.four,.fixedav .avs.four{display:flex;flex-wrap:wrap;gap:6px}#tab-live .avs.four .av,.fixedav .avs.four .av{width:84px}
#tab-live .avs.four .avimg,.fixedav .avs.four .avimg{width:74px}#tab-live .avs.four .av img,#tab-live .avs.four .av .noimg,.fixedav .avs.four .av img,.fixedav .avs.four .av .noimg{width:74px;height:74px}
@media(max-width:820px){#tab-live .sqgrid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:820px){#tab-live .sq{font-size:15px}#tab-live .sq.evt .evv{font-size:13px}}
@media(max-width:560px){#tab-live .sqgrid{grid-template-columns:repeat(3,1fr)}#tab-live .sq{font-size:13px}#tab-live .sq.evt .evv,#tab-live .sq .sqs{font-size:11px}}
.sq.picked{border:2px solid var(--acc);background:rgba(122,90,248,.15)}
.urg{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.urg.u0{background:var(--warn)}.urg.u1{background:#e67e22}.urg.u2{background:#c9a227}.urg.u3{background:var(--ok)}
table.todo td{vertical-align:top;font-size:13px;padding:6px}table.todo tr.grp td{background:rgba(122,90,248,.14);font-weight:700}
.possib .pc2{display:inline-flex;align-items:center;gap:2px;margin:1px 6px 1px 0}.possib .pc2 img,.possib .pc2 .noimg{width:20px;height:20px;border-radius:4px}
.possib{margin-top:8px;font-size:13px;display:flex;flex-direction:column;gap:4px}.possib .chip img,.possib .chip .noimg{width:22px;height:22px}
.vimg{background:rgba(122,90,248,.25)!important;color:var(--acc);font-size:16px}.vimg .dot{width:14px;height:14px}
.needrow{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:8px;font-size:13px}.needrow select{padding:1px 4px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px}
.opt .slot{width:56px;height:56px;aspect-ratio:auto}
.tag{font-size:11px;padding:1px 6px;border-radius:8px;border:1px solid currentColor}
.t-must{color:#e67e22}.t-rec{color:var(--ok)}.t-bad{color:var(--warn)}.t-need{color:var(--acc)}.t-fill{color:#3a9ad9}.t-none{color:var(--mut)}
.opt.t-rec{border-color:var(--ok)}.opt.t-must{border-color:#e67e22}.opt.t-bad{border-color:var(--warn)}
.pc .unx{display:none;position:absolute;top:2px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--warn);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;z-index:2}.pc.unown .unx{display:block}
.pc .lowx{display:none;position:absolute;top:2px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--warn);color:#fff;font-size:15px;font-weight:700;line-height:17px;text-align:center;z-index:2}.pc.low .lowx{display:block}
.pc.low.sel{border-color:var(--warn)}
.pc:not(.sel) .lc{display:none}
.nameidx{font-size:12px;line-height:1.8;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:4px}
pre.code{background:#0003;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;overflow:auto;max-height:240px}
header button.lockd{opacity:.45}
.linkw a{color:#fff}@media(prefers-color-scheme:light){.linkw a{color:var(--acc)}}
.elbtn{display:inline-flex;align-items:center;gap:4px}.elbtn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
details.card>summary{cursor:pointer}
label.upl{width:44px;height:44px;border:2px dashed var(--line);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--mut);cursor:pointer;overflow:hidden}
label.upl img{width:100%;height:100%;object-fit:cover}
.cons{position:absolute;left:3px;bottom:3px;min-width:15px;height:15px;padding:0 3px;border-radius:4px;background:rgba(0,0,0,.7);color:rgba(255,255,255,.85);font-weight:700;font-size:10px;line-height:15px;text-align:center;z-index:1}
.slot .cons{left:5px;bottom:5px;min-width:19px;height:19px;font-size:12px;line-height:19px}
.slot.sm .cons{min-width:14px;height:14px;font-size:10px;line-height:12px;left:1px;bottom:1px}
.av.bad{border-color:var(--warn)}.av.bad.dim{opacity:1;filter:none}.av.bad::after{content:'!';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--warn);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:2}
.slot.bad{border:2px solid var(--warn)}.slot .inv{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--warn);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:1}
.slot.r5 img{background:linear-gradient(#b0753a,#e3a65a)}.slot.r4 img{background:linear-gradient(#6d5a9e,#a787d6)}
.stn{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;color:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.35);z-index:1}
.slot .stn{top:4px;right:4px;width:20px;height:20px;font-size:12px}
.stn.s2{background:#2e9e5b}.stn.s1{background:#d68910}.stn.s0{background:#777}
.slot.sm .stn{width:16px;height:16px;font-size:10px;top:1px;right:1px}
label.cheer{display:inline-flex;gap:6px;align-items:center;margin:6px 0;padding:4px 10px;border:1px solid var(--ok);border-radius:8px;cursor:pointer}
.avimg{position:relative;width:60px;margin:auto}
.avs.four .avimg{width:100%}
.sec{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}
.sec>.sh{background:rgba(122,90,248,.14);padding:5px 10px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line)}
.sec>.sb{padding:8px 10px}
.sqgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sq{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:4px;background:var(--card);font-size:12px;line-height:1.3}
.sq:hover{border-color:var(--acc)}.sq.dis{opacity:.35;cursor:not-allowed}
.sq .sqi{font-size:20px;display:flex;gap:3px;align-items:center;min-height:22px}.sq .sqi .dot{width:12px;height:12px}
.sq .sqs{color:var(--mut);font-size:11px}
#mbox .sqgrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}#mbox .sq{font-size:13px}
.evrow{min-height:44px;border-bottom:1px dashed var(--line)}.evrow .evl[data-ee]{cursor:pointer}
.evrow x{font-size:20px;width:32px;height:32px;line-height:30px;text-align:center;border-radius:50%;flex:none}.evrow x:hover{background:#8883;color:var(--warn)}
.evrow .mini img,.evrow .mini .noimg{width:28px;height:28px;border-radius:6px;vertical-align:middle;object-fit:cover}
.sides{display:inline-flex;gap:2px}.sides button.on{background:var(--acc);color:#fff}
.card.done{box-shadow:0 0 0 2px var(--ok) inset}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--mut);overflow:hidden}
.slot:not(.empty){border-style:solid}
.slot img,.slot .noimg{width:100%;height:100%;object-fit:cover;background:#8883}
.slot.out img{filter:grayscale(1) brightness(.45)}.slot.bad{border-color:var(--warn)}.slot.dis{opacity:.35;cursor:not-allowed}
.slot.sm{width:40px;height:40px;aspect-ratio:auto;font-size:14px;border-radius:8px;flex:none}
.avs.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.avs.four .av{width:auto}.avs.four .av img,.avs.four .av .noimg{width:100%;height:auto;aspect-ratio:1}
.ledger{max-width:none}.evrow{display:flex;align-items:center;gap:6px;justify-content:space-between;padding:2px 0}
.evrow .evl{flex:1;min-width:0;line-height:1.6;overflow-wrap:anywhere}.evrow b{white-space:nowrap}.evrow x{cursor:pointer;color:var(--mut)}
.evrow.sum{border-top:1px solid var(--ink);font-weight:600}.evadd{margin:2px 0}
details.blv{margin:4px 0}details.blv summary{cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:8px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
.av.out img,.tile.out img{filter:grayscale(1) brightness(.5)}.av.out,.tile.out{opacity:.55}
.av.dis{opacity:.3;filter:grayscale(.8);cursor:not-allowed}
.tiles{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.tile{position:relative;display:inline-flex;flex-direction:column;align-items:center}
.tile img,.tile .noimg{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#8883}
.tile.bad img{outline:2px solid var(--warn)}
.tile x{position:absolute;top:-6px;right:-6px;background:var(--card);border:1px solid var(--line);border-radius:50%;width:16px;height:16px;font-size:11px;line-height:14px;text-align:center;cursor:pointer;color:var(--mut)}
.addt{height:48px;width:48px;font-size:18px}
.ledger{font-variant-numeric:tabular-nums;margin:4px 0;font-size:13px}
.ledger>div{display:flex;justify-content:space-between}.ledger .sum{border-top:1px solid var(--ink);margin-top:2px;padding-top:2px;font-weight:600}
.bpick{font-size:13px;gap:6px}
#modal .box{background:var(--bg);border-radius:12px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:14px}
</style>
</head>
<body>
<header>
  <h1>幻想真境劇詩規劃器</h1>
  <button data-tab="season" class="on">① 當期資料</button>
  <button data-tab="pool">② 角色池</button>
  <button data-tab="plan">③ 規劃</button>
  <button data-tab="todo">④ 待辦清單</button>
  <span style="flex:1"></span>
  <button id="wsbtn">工作區</button>
  <select id="lang" class="notr" title="Language"><option value="tw">繁中</option><option value="cn">简中</option><option value="en">English</option><option value="ja">日本語</option></select>
  <button id="exp">匯出全部</button>
  <button id="imp">匯入全部</button>
  <input type="file" id="impf" accept=".json" class="hide">
</header>
<main>
<section id="tab-season"></section>
<section id="tab-pool" class="hide"></section>
<section id="tab-plan" class="hide"></section>
<section id="tab-todo" class="hide"></section>
</main>
<div id="toast"></div>
<div id="modal" class="hide"><div class="box" id="mbox"></div></div>

<!-- 角色資料與頭像：由 yatta.moe API 下載到本機（data/characters.js、assets/avatars/） -->
<script src="data/characters.js"></script>
<script src="data/names.js"></script>
<script src="data/i18n.js"></script>
<script>
/* ============ 語言切換 ============ */
// 程式內文字都以繁中撰寫；顯示時把畫面上的文字依對照表換成目標語言（角色名用官方譯名）
let LANG=(()=>{try{return localStorage.getItem('theatar-lang')||'tw'}catch(e){return'tw'}})(),TR=null;
const NAME_KEY={cn:'chs',en:'en',ja:'jp'};
function buildTR(){if(LANG==='tw'||!window.I18N){TR=null;return}
 const dict={...(I18N[LANG]||{})};const nk=NAME_KEY[LANG];
 Object.entries(window.CHAR_NAMES||{}).forEach(([tw,v])=>{if(v?.[nk])dict[tw]=v[nk]});
 // 單一個中文字（如「中」「高」「名」）只在整段文字完全相同時才翻，避免把其他詞切壞；元素字與標點例外
 const single=k=>[...k].length===1&&/[㐀-鿿]/.test(k)&&!(I18N.elem||[]).includes(k);
 const keys=Object.keys(dict).filter(k=>!single(k)).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
 TR={dict,re:new RegExp(keys.join('|'),'g'),char:LANG==='cn'?I18N.cnChar:null}}
function tr(s){if(!TR||!s||!/[　-鿿＀-￯]/.test(s))return s;
 const tt=s.trim();if(TR.dict[tt]!=null&&TR.char==null)return s.replace(tt,TR.dict[tt]);
 const en=LANG==='en',lead=s.match(/^\s*/)[0],trail=s.match(/\s*$/)[0];
 // 英文：先處理含數字的幕名，再逐詞替換（前後補空白），最後整理空白與量詞
 if(en)s=s.replace(/第\s*10\s*幕打完即結束，不給花/g,' Act 10 ends the run; no flowers ').replace(/第\s*(\d+)\s*幕\s*之前/g,' By Act $1 ').replace(/圣牌挑戰\s*(I+)\s*之前/g,' By Arcana $1 ').replace(/第\s*(\d+)\s*幕/g,' Act $1 ');
 let r=s.replace(TR.re,m=>en?' '+TR.dict[m]+' ':TR.dict[m]);
 if(en){r=r.replace(/(\d+)\s*選\s*1/g,'pick 1 of $1').replace(/(\d+)\s*[名人]/g,'$1').replace(/(\d+)\s*格/g,'$1 slot(s)')

  const i=$('#pq');i.oninput=()=>{q=i.value.trim();draw();const j=$('#pq');j.focus();j.setSelectionRange(q.length,q.length)};

/* ============ 幕順序（圣牌挑戰可移動） ============ */
// 圣牌 I 於第 4 幕後出現、圣牌 II 於第 6 幕後出現，都必須在第 10 幕前完成
const ARC_AFTER={c1:'a4',c2:'a6'};
const DEFAULT_ORDER=ACTS.map(a=>a.k);
function validOrder(o){if(!Array.isArray(o)||o.length!==DEFAULT_ORDER.length||DEFAULT_ORDER.some(k=>!o.includes(k)))return false;
 const ix=k=>o.indexOf(k),main=o.filter(k=>k[0]==='a');
 if(main.join()!==DEFAULT_ORDER.filter(k=>k[0]==='a').join())return false;
 return Object.entries(ARC_AFTER).every(([c,a])=>ix(c)>ix(a)&&ix(c)<ix('a10'))}
function order(){if(!validOrder(S.order))S.order=[...DEFAULT_ORDER];return modeOf().arc?S.order:S.order.filter(k=>!ACT[k].arc)}
function moveArc(k,d){const o=[...order()],i=o.indexOf(k),j=i+d;if(j<0||j>=o.length)return'';
 [o[i],o[j]]=[o[j],o[i]];if(!validOrder(o))return k==='c1'?'圣牌挑戰 I 只能排在第 4 幕之後、第 10 幕之前':'圣牌挑戰 II 只能排在第 6 幕之後、第 10 幕之前';
 S.order=o;return''}

/* ============ 神秘收穫 ============ */

 A3:{name:'獲得隨機角色，本幕戰後不選人',kind:'standby',noPick:1,excl:'A4'},

 A5:{name:'獲得 2 次事件選項重擲',noop:1},
 A6:{name:'神秘收穫選項數量 +1',noop:1},
 A7:{name:'神秘收穫可重骰一次選項',noop:1},

const MYST40={

 B4:{name:'1~2 名體力耗盡角色洗回待命',kind:'exhausted',two:1},

 B6:{name:'整體祝福等級 +1'},

// 邀請種類
const INV={el:{label:'邀請（指定元素）',n:3},all:{label:'邀請（全元素）',n:3},grand:{label:'盛邀',n:6}};
/* ============ 逐幕模擬 ============ */
// 每幕（進入敵人關卡前）依序處理事件：持有 − 花費 + 神秘收穫收入 = 剩餘；出戰 4 人各扣 1 體力；
// 本幕戰鬥獎勵（含標記 +20、其他）加到下一幕；戰後選入的角色下一幕可用
function rewardOf(a,p){const F=S.flower;if(a.k==='a10')return 0; // 第 10 幕打完就結束，不給花
 if(p.reward!=null)return p.reward;
 return a.arc?F.arc:a.boss?F.boss:p.variant==='c'?F.elite:F.battle}
function sim(){
 const F=S.flower,R=rosterNames(),ex=extraCount();
 const st={};R.forEach(n=>st[n]=null);openingNames().forEach(n=>st[n]=STAMINA); // null=待命，數字=已選入且剩餘體力
 const init=F.base+ex*F.perExtra,blessInit=ex*2;let bal=init,blv=blessInit,invD=0,blD=0,grD=0,plus=0,rsv=0; // rsv：花為 0 得 80 花，0＝未取得、1＝待觸發、2＝已生效
 const lvl={},used={},rows=[];const snap=()=>({...st});VIRT={};GEN=[];GSRC={};let vc=0;
 // 之後各幕固定格還要用到的次數（決定條件格能動用誰的體力）
 const ord=order(),remFix={};ord.forEach(k=>actPlan(k).fight.forEach(t=>{if(t&&!isCond(t))remFix[t]=(remFix[t]||0)+1}));
 // 規劃中有指名的角色（固定出戰、指名選入／邀請／神秘收穫）是專門要找的人，不算在「任意」選入的可能人選裡
 const named=new Set();ord.forEach(k=>{const p=actPlan(k);p.fight.forEach(t=>{if(t&&!isCond(t))named.add(t)});if(p.pick&&!isCond(p.pick))named.add(p.pick);
  p.ev.forEach(e=>{if(e.n&&!isCond(e.n))named.add(e.n);(e.ns||[]).forEach(x=>x&&named.add(x))})});
 order().forEach(k=>{const a=ACT[k],p=actPlan(k),err=[],pre=snap(),before=bal,lvl0={...lvl},lines=[];let noPick=false,mark='';
  // ref：這次選入在規劃中的位置；from：若是從「任意」選定成具體角色，記錄原本的條件
  const unlock=(n,why,ref,from)=>{if(!n)return err.push(`${why}：尚未指定角色`);
   const tok=isCond(n)?n:from;
   if(tok){const el=tok==='@any'?null:tok.slice(4),pool=Object.keys(st).filter(x=>!isVirt(x)&&st[x]===null&&(!named.has(x)||x===n)&&(!el||elOf(x)===el));
    // 前面以條件選入（尚未選定）、候選池有重疊的人，各會先拿走其中 1 位，所以實際可選人數要扣掉
    // 最少：每個重疊的人都拿走本池 1 位；最多：盡量讓他們拿本池以外的人（用配對算出至少有幾位非得從本池拿）
    const prior=Object.keys(VIRT).filter(v=>VIRT[v].pool.some(x=>pool.includes(x)));
    const outside=[...new Set(prior.flatMap(v=>VIRT[v].pool))].filter(x=>!pool.includes(x));
    const away=matchSlots(prior.map(v=>({ok:c=>VIRT[v].pool.includes(outside[c])})),outside.length,outside.map(()=>1)).filter(x=>x>=0).length;
    const effMin=Math.max(0,pool.length-prior.length),effMax=Math.max(0,pool.length-(prior.length-away)),eff=effMin;
    const lbl=`${condText(tok)}（${a.label}${/^(邀請|盛邀|戰後選入)/.test(why)?why.replace(/（.*?）/g,''):'神秘收穫'}）`;
    GEN.push({...ref,tok,pool,prior,eff,effMin,effMax,lbl,chosen:isCond(n)?null:n});if(!isCond(n))GSRC[n]=ref;
    if(isCond(n)){if(!pool.length)return err.push(`${why}：沒有待命的${el?EL[el]+'系':''}角色`);
     const key='#v'+(++vc);VIRT[key]={el,label:lbl,pool,prior,eff,ref};st[key]=STAMINA;
     if(effMax<=0)err.push(`${why}：符合條件的人都已被前面的條件選入拿走`);
     else if(effMin<=0)err.push(`${why}：最壞情況下符合條件的人會被前面的條件選入拿光（最多 ${effMax} 人）`);return}}
   if(!(n in st))return err.push(`${why}：「${n}」不在參演名單`);
   if(st[n]!==null)return err.push(`${why}：「${n}」已選入`);st[n]=STAMINA};
  const elemBless=(n,side,why)=>{const l=(lvl[n]||0)+1;lvl[n]=l;blv++;
   if(l>MAX_BLESS)err.push(`祝福「${n}」超過 ${MAX_BLESS} 級`);return l};
  const applyB=(e,why)=>{const b=MYST40[e.b];let g=0;if(!b){err.push(`${why}：未選內容`);return 0}
   if(e.b==='B1')g=e.o==='失敗'?0:90;
   if(e.b==='B2')g=+(e.o||20);
   if(e.b==='B3'){if(!e.n)err.push(`${why}：尚未指定角色`);else if(st[e.n]==null)err.push(`${why}：「${e.n}」尚未選入`);else st[e.n]=Math.min(STAMINA,st[e.n]+(+e.o||1))}
   if(e.b==='B4')(e.ns||[]).filter(Boolean).forEach(n=>{if(st[n]!==0)err.push(`${why}：「${n}」體力未耗盡`);else st[n]=null});
   if(e.b==='B6')blv++;
   if(e.b==='B7')plus+=15;
   if(e.b==='B9'){if(rsv)err.push(`${why}：「${b.name}」${rsv===1?'已取得、尚未生效':'已生效過'}，這次沒有效果`);else rsv=1}return g};
  p.ev.forEach((e,j)=>{const ctx=snap(),bal0=bal;let c=0,g=0,l=0;
   if(e.t==='buy'){c=e.kind==='grand'?F.grand+invD+grD:F.invite+invD;g=e.cheer?25:0;unlock(e.n,INV[e.kind||'all'].label,{k,kind:'ev',j},e.from)}
   else if(e.t==='bless'){c=F.bless+blD;l=elemBless(e.n)}
   else if(e.t==='m40'){c=40;g=applyB(e,'40 花神秘收穫')}
   else if(e.t==='myst'){const d=MYST[e.id],why=d?.name||e.id;
    if(used[e.id])err.push(`「${why}」已在${ACT[used[e.id]].label}選過（每種只能一次）`);
    if(d?.excl&&used[d.excl])err.push(`「${why}」與「${MYST[d.excl].name}」互斥`);
    used[e.id]=k;c=d?.cost||0;
    if(e.id==='A2'){c=Math.max(0,bal);unlock(e.n,why,{k,kind:'ev',j},e.from)}
    if(e.id==='A3')unlock(e.n,why,{k,kind:'ev',j},e.from);
    if(e.id==='A4'&&e.n)unlock(e.n,why);
    if(d?.noPick)noPick=true;
    if(e.id==='A8'){if(!e.n)err.push(`${why}：尚未指定角色`);else if(st[e.n]==null)err.push(`${why}：「${e.n}」尚未選入`);else mark=e.n}
    if(e.id==='A9'){invD+=10;blD-=10}
    if(e.id==='A10'){invD-=10;blD+=10}
    if(e.id==='A13')grD-=20;
    if(e.id==='A11')g=applyB(e,why);
    if(e.id==='A12'){if(!e.n)err.push(`${why}：尚未指定角色`);else if(st[e.n]==null)err.push(`${why}：「${e.n}」尚未選入`);else st[e.n]=Math.min(STAMINA,st[e.n]+1)}}
   const short=c>0&&bal0-c<0; // 花費在收入之前結算，付款當下不得為負
   if(short)err.push(`幻劇之花不足以支付：持有 ${bal0}，需要 ${c}（收入要付款後才拿到）`);
   bal=bal0-c+g;let rz=false;if(rsv===1&&bal===0){bal=80;g+=80;rsv=2;rz=true} // 花歸零時觸發一次
   lines.push({e,j,c,g,l,ctx,bal,short,rz});if(!short&&bal<0)err.push(`幻劇之花不足（${bal}）`)});
  const left=bal,entry=snap(),fight=p.fight.filter(Boolean);
  if(fight.length!==4)err.push(`出戰需剛好 4 人（目前 ${fight.length}）`);
  fight.filter(n=>!isCond(n)).forEach(n=>{remFix[n]--;if(!(n in st))err.push(`出戰「${label(n)}」不在參演名單`);else if(st[n]===null)err.push(`「${label(n)}」尚未選入，不能出戰`);else if(st[n]<=0)err.push(`「${label(n)}」體力已耗盡`);else st[n]--});
  // 條件格：從此刻符合條件、還有體力的人中挑「扣掉之後固定格需求後最有餘裕」的人（同分優先用條件選入的虛擬角色）
  const usedNow=new Set(fight.filter(n=>!isCond(n))),assign=p.fight.map(()=>null);
  p.fight.forEach((t,si)=>{if(!isCond(t))return;
   // 排除體力要留給之後固定格的人（扣掉之後的固定出戰次數後沒有剩）
   const spare=x=>st[x]-(remFix[x]||0);
   const fits=Object.keys(st).filter(x=>st[x]>0&&!usedNow.has(x)&&(isVirt(x)?virtFits(x,t):t==='@any'||elOf(x)===t.slice(4)));
   const cands=fits.filter(x=>spare(x)>0).sort((x,y)=>spare(y)-spare(x)||isVirt(y)-isVirt(x));
   if(!cands.length){err.push(fits.length?`沒有人能填「${condText(t)}」（${fits.map(label).join('、')} 的體力要留給後面的固定格）`:`沒有人能填「${condText(t)}」`);assign[si]={who:null,cands,reserved:fits};return}
   const who=cands[0];
   // 用條件選入的人填元素格：把他的候選池收窄到該元素（之後也受這個限制）
   if(isVirt(who)&&t!=='@any'){const v=VIRT[who],el=t.slice(4);if(!v.bound&&!v.el){v.pool=v.pool.filter(x=>elOf(x)===el);v.bound=el}}
   st[who]--;usedNow.add(who);assign[si]={who,cands,lbl:label(who)}});
  const bonus=mark&&fight.includes(mark)?20:0,reward=rewardOf(a,p),other=+p.other||0;
  bal+=reward+bonus+plus+other;
  const postBattle=snap();
  // 戰後選入必選 1 名；例外：神秘收穫「戰後不選人」、最後一幕、已無待命角色
  const last=k===order().at(-1),anyStand=Object.values(postBattle).some(v=>v===null);
  if(p.pick){if(noPick)err.push('本幕有「戰後不選人」的神秘收穫，戰後選入無效');else if(last)err.push('最後一幕結束後不選人');else unlock(p.pick,'戰後選入',{k,kind:'pick'},p.pickFrom)}
  else if(!noPick&&!last&&anyStand)err.push('戰後選入尚未選擇（必選 1 名）');
  rows.push({a,p,err,last,assign,gen:GEN.filter(x=>x.k===k),pre,entry,postBattle,after:snap(),before,lines,left,reward,bonus,plus,other,next:bal,blv,lvl0,lvl:{...lvl},noPick,used:{...used}})});
 return{init,ex,blessInit,rows,end:bal,R}}
function summary(r){const s={avail:0,used:0,stand:0};Object.values(r).forEach(v=>v===null?s.stand++:v>0?s.avail++:s.used++);return s}

/* ============ 檢查 ============ */
function checks(sm){
 const out=[],R=rosterNames();
 out.push({lv:rosterOK(R.length)?'ok':'warn',t:`參演角色 ${R.length} 名（開幕 ${openingNames().length}${S.support?'，含助演 1':''}；需 ${ROSTER_MIN}~${ROSTER_MAX}）`});
 const low=R.filter(n=>levelOf(n)<70);if(low.length)out.push({lv:'warn',t:'未達 Lv.70：'+low.join('、')});
 const bad=R.filter(n=>!allowed(n));if(bad.length)out.push({lv:'warn',t:'非當期元素且非特邀：'+bad.join('、')});
 sm.rows.filter(r=>r.p.done).forEach(r=>r.err.forEach(e=>out.push({lv:'warn',t:`${r.a.label}：${e}`})));
 const nd=sm.rows.filter(r=>r.p.done).length;out.push({lv:'mut',t:`已完成 ${nd}/${sm.rows.length} 幕（按各幕的「完成」後才檢查該幕）`});
 return out}

/* ============ 規劃頁 ============ */
function statusPanel(snapObj,title){const sel=[],stand=[];Object.entries(snapObj).forEach(([n,v])=>(v===null?stand:sel).push(n));
 const s=summary(snapObj);
 return`<details class="stp"><summary>${title}：可出戰 ${s.avail}・體力耗盡 ${s.used}・待命 ${s.stand}</summary>

 openMenu(base.t==='m40'?'40 花神秘收穫':'珍貴收穫（15 花）',Object.entries(MYST40).map(([key,b])=>({key,label:b.name,sub:b.noop?'無模擬效果':''})),b=>{

     toggle:n=>{const i=ns.indexOf(n);i>=0?ns.splice(i,1):ns.push(n)},block:()=>ns.length>=2?'最多 2 名':'',sta:n=>ctx[n],onClose:()=>fin({...x,ns})})}

  openPicker({title:`${r.a.label}・選擇出戰（4 人）`,cons:true,names:()=>[...new Set([...Object.keys(r.entry),...picks])],bad:n=>fightBad(r,n),dim:n=>!!fightBad(r,n),
   sel:n=>picks.includes(n),block:()=>picks.length>=4?'已選滿 4 人，請先取消其他角色':'',
   toggle:n=>{const x=picks.indexOf(n);x>=0?picks.splice(x,1):picks.push(n);setTimeout(refresh)},sta:n=>r.entry[n],
   head:()=>`<div class="mut">已選 <b id="fcnt">${picks.length}</b>/4；點數＝進場時剩餘體力。選好後按「完成」。</div>
    <div id="fwarn">${fwarn()}</div><div class="mut">淡化＝尚未選入或體力耗盡，仍可選，但會標紅框，按「完成」時會警告。</div>`,
   top:()=>`<div class="elgrp"><div class="eh">條件格 <span class="mut">點空框加一個（旁邊會再出現一個），點已選的框取消</span></div><div class="avs"><span class="cw" data-cw="@any"></span></div></div>`,
   pre:e=>(S.season.elements.length?S.season.elements:Object.keys(EL)).includes(e)?`<span class="cw" data-cw="@el:${e}"></span>`:'',

   sel:n=>p.pick===n,bad:n=>r.postBattle[n]!==null?'已選入過或不在名單':'',toggle:n=>{p.pick=n;delete p.pickFrom;markEdit(k)},note:'只列出戰後仍在待命的角色；點其他角色即可更換。也可以只指定「任意」或「任一某元素」。',

/* ============ 出戰條件格 ============ */
// 出戰格的值：角色名＝固定；'@any'＝任意；'@el:cryo'＝任一該元素
const isCond=t=>typeof t==='string'&&t.startsWith('@');
const condText=t=>t==='@any'?'任意':`任一${EL[t.slice(4)]||'?'}`;
const condOK=(t,n)=>t==='@any'||elOf(n)===t.slice(4);

/* ============ 可行性：配對與截止期限 ============ */
// 帶容量的二分配對（Kuhn）：slots[i].ok(c) 判斷角色 c 能否填，cap[c]＝可用次數；回傳每格配到的角色（-1＝配不到）
function matchSlots(slots,nChars,cap){const asg=new Array(slots.length).fill(-1),use=Array.from({length:nChars},()=>[]);
 const tryS=(s,seen)=>{for(let c=0;c<nChars;c++){if(seen[c]||!slots[s].ok(c))continue;seen[c]=1;
  if(use[c].length<cap[c]){use[c].push(s);asg[s]=c;return true}
  for(let x=0;x<use[c].length;x++){const o=use[c][x];if(tryS(o,seen)){use[c][x]=s;asg[s]=c;return true}}}return false};
 slots.forEach((_,s)=>tryS(s,new Array(nChars).fill(0)));return asg}
// 規劃頁：依目前規劃的選入時間，檢查條件格能否配到人；固定格由 sim() 檢查
function planGaps(sm){const names=Object.keys(sm.rows[0].pre),N=names.length,end=sm.rows.at(-1).after;
 const cap=names.map(n=>Math.max(0,end[n]??0)),slots=[];
 sm.rows.forEach(r=>r.p.fight.forEach(t=>{if(isCond(t))slots.push({act:r.a.label,t,ok:c=>r.entry[names[c]]!=null&&condOK(t,names[c])})}));
 const asg=matchSlots(slots,N,cap),gap={};slots.forEach((s,i)=>{if(asg[i]<0)(gap[s.act]??=[]).push(condText(s.t))});return gap}
// 截止期限：固定格角色（非開幕）第一次出戰的幕；比較「該幕前需到位人數」與「之前的免費選角次數」
function deadlines(){const ord=order(),first={};
 ord.forEach((k,i)=>actPlan(k).fight.forEach(t=>{if(t&&!isCond(t)&&!isOpening(t)&&!(t in first))first[t]=i}));
 let cum=0;return ord.map((k,i)=>{const due=Object.keys(first).filter(n=>first[n]===i);cum+=due.length;
  return{k,label:ACT[k].label,due,need:cum,free:i}})}

/* ============ ④ 待辦清單 ============ */
// 依各幕出戰隊伍，列出「要在第幾幕前找到誰／補幾個人」以及急迫程度
const URG=[{t:'緊急',c:'u0'},{t:'高',c:'u1'},{t:'中',c:'u2'},{t:'低',c:'u3'}];
function todoItems(){const ord=order(),sm=sim(),R=rosterNames(),ops=openingNames(),F=S.flower,items=[];
 const pool0=Math.max(1,R.length-ops.length);   // 開局待命人數
 const nPick=i=>{const a=ACT[ord[i]];return a.boss||a.arc?3:2};
 // 第 d 幕前的戰後選人中，至少看到某特定角色一次的機率（每幕選走 1 人，待命池遞減）
 const pSeen=d=>{let miss=1;for(let j=0;j<d;j++){const n=Math.max(1,pool0-j);miss*=Math.max(0,1-nPick(j)/n)}return 1-miss};
 // 第 d 幕前至少看到某元素任一角色的機率（該元素待命 m 人）
 const pSeenEl=(d,m)=>{let miss=1;for(let j=0;j<d;j++){const n=Math.max(1,pool0-j),k=Math.min(nPick(j),n);let q=1;for(let x=0;x<k;x++)q*=Math.max(0,(n-m-x)/(n-x));miss*=q}return 1-miss};
 const planned={};ord.forEach((k,i)=>{const p=actPlan(k);if(p.pick)planned[p.pick]??=i;p.ev.forEach(e=>{if(e.t==='buy'&&e.n)planned[e.n]??=i;if(e.t==='myst'&&e.n)planned[e.n]??=i})});
 // ① 指定角色（非開幕）
 const first={},uses={};ord.forEach((k,i)=>actPlan(k).fight.forEach(t=>{if(!t||isCond(t)||isVirt(t))return;uses[t]=(uses[t]||0)+1;if(!isOpening(t)&&!(t in first))first[t]=i}));
 const dueOrder=Object.keys(first).sort((x,y)=>first[x]-first[y]);let cum=0;
 dueOrder.forEach(n=>{const d=first[n];cum++;const slack=d-cum,p=pSeen(d),e=elOf(n);
  const nEl=R.filter(x=>!isOpening(x)&&elOf(x)===e).length,pInv=Math.min(1,3/Math.max(1,nEl));
  let u=p<0.3||slack<0?0:p<0.6?1:p<0.85?2:3;const notes=[];
  if(planned[n]!=null&&planned[n]<d){u=3;notes.push(`規劃中已在${ACT[ord[planned[n]]].label}取得`)}
  else{notes.push(`戰後選人到期前看到他的機率約 ${Math.round(p*100)}%`);
   if(slack<0)notes.push(`這之前要到位的人比免費選人次數多 ${-slack} 人，一定要靠邀請`);
   notes.push(`沒看到就在${ACT[ord[d]].label}事件階段用「邀請・${EL[e]||'?'}」（每次約 ${Math.round(pInv*100)}%，期望 ${Math.round(F.invite/pInv)} 花）`)}
  if(!R.includes(n))notes.unshift('⚠ 不在參演名單');
  if((uses[n]||0)>STAMINA)notes.push(`⚠ 出戰 ${uses[n]} 次，超過 ${STAMINA} 點體力，需要回復體力`);
  items.push({d,u,kind:'角色',what:n,av:n,notes})});
 // ② 指定元素的條件格：最早需要的幕與總格數（「任意」格併入 ③）
 const cond={};ord.forEach((k,i)=>actPlan(k).fight.forEach(t=>{if(isCond(t)&&t!=='@any'){(cond[t]??={d:i,n:0}).n++}}));
 Object.entries(cond).forEach(([t,v])=>{const e=t.slice(4),m=R.filter(x=>!isOpening(x)&&elOf(x)===e).length,p=pSeenEl(v.d,m);
  items.push({d:v.d,u:p<0.6?1:p<0.85?2:3,kind:'條件格',what:`${condText(t)} ×${v.n} 格`,notes:[`第一次在${ACT[ord[v.d]].label}；戰後選人前看到任一${EL[e]}角色的機率約 ${Math.round(p*100)}%`]})});
 // ③ 隨意隊友：假設完全不邀請、只靠戰後選人（需要的指定角色依期限優先選到，其餘選到的人可填任何條件格），
 //    逐幕做配對，找出第一次排不出隊伍的幕＝最晚要邀請隨意隊友的時機；補上一人後繼續往後找
 inviteAny(ord,first,uses).forEach(x=>items.push({d:x.d,u:0,kind:'補人',what:x.el?`邀請 1 名${EL[x.el]}系隊友（第 ${x.n} 位）`:`邀請 1 名隨意隊友（第 ${x.n} 位）`,
  notes:[x.found>x.d?`只靠戰後選人，到${ACT[ord[x.found]].label}會排不出隊伍（缺 ${x.short} 格）；因為${ACT[ord[x.d]].label}的條件格要先用掉其他人的體力，所以要提早到這幕`:`只靠戰後選人，到${ACT[ord[x.d]].label}會排不出隊伍（缺 ${x.short} 格）`,x.el?`最晚在${ACT[ord[x.d]].label}事件階段邀請；要能填「任一${EL[x.el]}」，用「邀請・${EL[x.el]}」必定拿到 1 名${EL[x.el]}系（${S.flower.invite} 花）`:`最晚在${ACT[ord[x.d]].label}事件階段邀請；任何人都可以，用「邀請（全元素）」必定拿到 1 人（${S.flower.invite} 花）`]}));
 return items.sort((x,y)=>x.d-y.d||x.u-y.u)}
// 推算「隨意隊友」的最晚邀請時機。chars：開幕（第 0 幕起）、指定角色（依期限分配到之前的戰後選人，不夠的在期限幕邀請）、
// 其餘戰後選人（通用角色，可填任何條件格）。每人 2 點體力；逐幕配對，缺格時在該幕補 1 名通用角色。
function inviteAny(ord,first,uses){const A=ord.length,chars=[];
 openingNames().forEach(n=>chars.push({n,from:0}));
 const picks=[...Array(A-1).keys()].map(j=>({from:j+1,used:false}));  // 第 j 幕戰後選的人，第 j+1 幕起可用
 Object.keys(first).sort((x,y)=>first[x]-first[y]).forEach(n=>{const pk=picks.find(p=>!p.used&&p.from<=first[n]);
  if(pk){pk.used=true;chars.push({n,from:pk.from})}else chars.push({n,from:first[n]})});
 picks.filter(p=>!p.used).forEach(p=>chars.push({n:null,from:p.from}));
 const out=[];let added=0;
 for(let k=0;k<A;k++){
  for(let guard=0;guard<8;guard++){const slots=[],seen={};
   // 指定角色超過 2 次或不在名單的格子，補隨意隊友也解決不了，不列入（角色那列已另外提醒）
   for(let i=0;i<=k;i++)actPlan(ord[i]).fight.forEach(t=>{if(!t)return;if(!isCond(t)){seen[t]=(seen[t]||0)+1;if(seen[t]>STAMINA||!chars.some(ch=>ch.n===t))return}
    slots.push({i,ok:c=>{const ch=chars[c];if(ch.from>i)return false;if(!isCond(t))return ch.n===t;if(ch.n===null)return ch.el==null||t==='@any'||ch.el===t.slice(4);return condOK(t,ch.n)}})});
   const missOf=()=>matchSlots(slots,chars.length,chars.map(()=>STAMINA)).filter(x=>x<0).length,miss=missOf();
   if(!miss)break;
   // 缺格可能是更早的幕把體力用掉造成的：從第 k 幕往前找「補一人能減少缺格」的最晚時機
   let at=-1;for(let f=k;f>=0;f--){chars.push({n:null,from:f});const m=missOf();chars.pop();if(m<miss){at=f;break}}
   if(at<0)break; // 補隨意隊友解決不了（例如指定角色本身的問題）
   // 補的人要不要指定元素：先試「只能填任意格的人」，不行再試各元素
   let el=null;chars.push({n:null,from:at,el:'-'});const anyOk=missOf()<miss;chars.pop();
   if(!anyOk)for(const e of Object.keys(EL)){chars.push({n:null,from:at,el:e});const ok=missOf()<miss;chars.pop();if(ok){el=e;break}}
   chars.push({n:null,from:at,el:el||undefined});added++;out.push({d:at,n:added,short:miss,found:k,el})}}
 return out}
function rTodo(){const ord=order(),items=todoItems();let h='',cur=-1;
 items.forEach(it=>{if(it.d!==cur){cur=it.d;h+=`<tr class="grp"><td colspan="4">${ACT[ord[cur]].label} 之前</td></tr>`}
  h+=`<tr><td><span class="urg ${URG[it.u].c}">${URG[it.u].t}</span></td><td class="mut">${it.kind}</td>
   <td>${it.av?`<span class="chip">${avatar(it.av)}${esc(it.what)}</span>`:esc(it.what)}</td><td>${it.notes.map(esc).join('<br>')}</td></tr>`});
 $('#tab-todo').innerHTML=`<div class="card"><h3>④ 待辦清單</h3>
  <div class="mut">依「③ 規劃」各幕的出戰隊伍，按時間順序列出要找的人與要補的隊友。急迫度依「到期前靠戰後選人看到的機率」估算：<span class="urg u0">緊急</span> 一定要邀請、<span class="urg u1">高</span> 不到 60%、<span class="urg u2">中</span> 不到 85%、<span class="urg u3">低</span>。</div>
  ${items.length?`<table class="todo"><tr><th>急迫<th>類型<th>項目<th>說明</tr>${h}</table>`:'<p class="mut">規劃中沒有需要額外取得的角色或祝福。先到「③ 規劃」填出戰隊伍。</p>'}</div>`}

// 查看／選定「任意」選入的實際人選；選定後改成該角色，但保留原本的條件（pickFrom／from）
function genRef(k,kind,j){const p=actPlan(k);return kind==='pick'?{get:()=>p.pick,from:()=>p.pickFrom,set:(n,f)=>{p.pick=n;f?p.pickFrom=f:delete p.pickFrom}}
 :{get:()=>p.ev[j]?.n,from:()=>p.ev[j]?.from,set:(n,f)=>{const e=p.ev[j];e.n=n;f?e.from=f:delete e.from}}}
function openGenPool(k,kind,j){const g=sim().rows.find(r=>r.a.k===k)?.gen.find(x=>x.kind===kind&&(kind==='pick'||x.j===j));if(!g)return toast('找不到這筆任意選入');
 const ref=genRef(k,kind,j),pool=[...g.pool],tok=g.tok;
 openPicker({title:`${ACT[k].label}・${g.lbl}：可能選到的人（${effText(g)} 人）`,cons:true,single:1,names:()=>pool,sel:n=>g.chosen===n,
  // 點已選定的角色＝改回原本的「任意」條件
  toggle:n=>{g.chosen===n?ref.set(tok):ref.set(n,tok);markEdit(k)},
  top:()=>g.prior?.length?`<div class="elgrp"><div class="eh">可能被前面的條件選入拿走（不知道是誰）</div><div class="avs">${g.prior.map(x=>`<div class="av condcell"><div class="avimg"><div class="condimg">?</div></div><div class="nm" title="${esc(VIRT[x]?.label||'')}">${esc((VIRT[x]?.label||'').replace(/（|）/g,' '))}之一</div></div>`).join('')}</div></div>`:'',
  note:`此時還在待命、規劃中沒有另外指名的${tok==='@any'?'':EL[tok.slice(4)]+'系'}角色共 ${pool.length} 人${g.prior?.length?`。前面有 ${g.prior.length} 個條件選入可能拿走其中的人：最壞情況全拿這裡的人，剩 ${g.effMin} 人；最好情況盡量拿別處的人，剩 ${g.effMax} 人`:''}。點頭像＝確定就是他（仍保留「${condText(tok)}」標記）；再點一次已選的角色＝改回「${condText(tok)}」。`})}
// 重置所有從「任意／任一某元素」選定成具體角色的選入（戰後選入、邀請、神秘收穫），改回原本的條件
const anyResolved=()=>order().flatMap(k=>{const p=actPlan(k);return[...(p.pickFrom?[[k,'pick',null]]:[]),...p.ev.map((e,j)=>e.from?[k,'ev',j]:null).filter(Boolean)]});
const resetAnyBtn=()=>`<button class="resetany" ${anyResolved().length?'':'disabled'}>重置所有任意選定（${anyResolved().length}）</button>`;
function bindResetAny(){document.querySelectorAll('.resetany').forEach(b=>b.onclick=()=>{const ks=anyResolved();if(!ks.length)return;
 histLabel='重置所有任意選定';ks.forEach(([k,kind,j])=>{const r=genRef(k,kind,j);r.set(r.from());markEdit(k)});closeModal();toast(`已把 ${ks.length} 個選定改回任意`)})}
// 選人視窗裡的條件格（與頭像同大小）
function condCell(t){return`<div class="av condcell" data-addc="${t}" title="${condText(t)}：點一下加入"><div class="avimg"><div class="condimg">${t==='@any'?'✱':dot(t.slice(4))}</div><span class="cbadge"></span></div><div class="nm">${condText(t)}</div></div>`}
// 規劃頁的可行性摘要
function feasCard(sm){const gap=planGaps(sm),dl=deadlines(),due=dl.filter(d=>d.due.length);
 return`<details class="stp"><summary>可行性分析：條件格缺口 ${Object.values(gap).flat().length} 格・需選入的固定角色 ${dl.at(-1)?.need||0} 名</summary>
  ${Object.keys(gap).length?`<h4>條件格配不到人（依目前規劃的選入時間）</h4>${Object.entries(gap).map(([a,l])=>`<div class="warn">${a}：${l.join('、')}</div>`).join('')}`:'<div class="ok">條件格都能配到人</div>'}
  <h4>截止期限（固定格角色第一次出戰的幕）</h4>${due.length?`<table><tr><th>幕<th>需到位<th class="n">累計需要<th class="n">之前的免費選角<th class="n">至少邀請</tr>
  ${due.map(d=>`<tr><td>${d.label}<td>${d.due.map(esc).join('、')}<td class="n">${d.need}<td class="n">${d.free}<td class="n ${d.need>d.free?'warn':''}">${Math.max(0,d.need-d.free)}</tr>`).join('')}</table>
  <div class="mut">免費選角每幕 1 次但候選隨機，不保證選得到；不足的部分要靠邀請或神秘收穫。</div>`:'<div class="mut">沒有需要另外選入的固定角色。</div>'}</details>`}

/* ============ 角色池頁 ============ */
// 持有：沒被匯入清單標成未持有，或目前是助演（借來的角色視為持有）
const owned=n=>n===S.support||poolBy(n)?.own!==false;
// 回傳不能切換的原因；可以則直接切換
function toggleRoster(n){
 if(S.locked)return'參演名單已確定，請先按「解除確定」';
 if(isOpening(n))return'開幕角色固定參演，不能取消';
 if(n===S.support)return'助演固定參演，要更換或取消請用上方「助演」區的按鈕';
 const c=poolBy(n);if(!c)return'';
 if(!c.in&&rosterFull())return`參演已達上限 ${ROSTER_MAX} 名（含開幕與助演），請先取消其他角色`;
 c.in=!c.in}
// 等級不足：持有但未滿 70 級（試用固定 90、助演為好友角色不檢查）

  <textarea id="sj">${esc(JSON.stringify(se,null,1))}</textarea>
  <div class="row"><button class="pri" id="sa" ${D}>套用 JSON</button></div><div id="sm"></div></details>
 <details class="card"><summary><b>進階：幻劇之花數值</b></summary><div class="row" style="margin-top:6px">
  ${inp('base','初始')}${inp('perExtra','每名額外角色 +')}${inp('battle','一般敵人(A/B)獎勵')}${inp('elite','精英敵人(C)獎勵')}${inp('boss','首領幕獎勵')}${inp('arc','圣牌挑戰獎勵')}
  ${inp('invite','邀請角色花費')}${inp('grand','盛邀花費')}${inp('bless','祝福每級花費')}<button id="frst">還原預設</button></div>
  <div class="mut" style="margin-top:4px">預設值取自攻略的近似值，請依遊戲內修正。</div></details>`;
 $('#slock')&&($('#slock').onclick=()=>{S.seasonLocked=true;save();show('pool')});
 $('#sunlock')&&($('#sunlock').onclick=()=>{S.seasonLocked=false;S.locked=false;rerender()});
 document.querySelectorAll('[data-fk]').forEach(i=>i.onchange=()=>{S.flower[i.dataset.fk]=+i.value||0;rerender()});
 $('#frst').onclick=()=>{S.flower={...DEFAULT_FLOWER};rerender()};
 $('#sname').onchange=e=>{se.name=e.target.value;save()};
 $('#smode').onchange=e=>{histLabel='切換難度';S.mode=e.target.value;rerender();toast(`已切換為${modeOf().label}模式（${ROSTER_MIN}~${ROSTER_MAX} 人）`)};
 document.querySelectorAll('[data-el]').forEach(b=>b.onclick=()=>{const k=b.dataset.el,l=se.elements,i=l.indexOf(k);
  if(i>=0)l.splice(i,1);else{if(l.length>=3)return toast('最多 3 種元素，請先取消一種');l.push(k)}rerender()});
 $('#sopen').onclick=()=>{const l=se.opening;openPicker({title:'選擇開幕角色（6 名）',names:allChars,sel:n=>l.includes(n),
  toggle:n=>{const i=l.indexOf(n);i>=0?l.splice(i,1):l.push(n)},block:()=>l.length>=6?'已選滿 6 名':'',
  dim:n=>se.elements.length&&!se.elements.includes(elOf(n)),head:()=>`<div class="mut">已選 <b id="fcnt">${l.length}</b>/6；每個開放元素各 1 名 5★ 與 1 名 4★。淡化＝非開放元素。</div>`})};
 $('#sguest').onclick=()=>{const l=se.guests;openPicker({title:'選擇特邀角色（4 名）',names:allChars,sel:n=>l.includes(n),
  toggle:n=>{const i=l.indexOf(n);i>=0?l.splice(i,1):l.push(n)},block:()=>l.length>=4?'已選滿 4 名':'',
  dim:n=>se.elements.includes(elOf(n)),head:()=>`<div class="mut">已選 <b id="fcnt">${l.length}</b>/4；特邀角色不受元素限制，通常是非開放元素。淡化＝開放元素。</div>`})};
 $('#sa').onclick=()=>{try{const j=JSON.parse($('#sj').value);S.season=Object.assign(blank().season,j);rerender()}catch(e){$('#sm').textContent='JSON 錯誤：'+e.message}};
 $('#ss').onclick=()=>{if(S.locked&&!confirm('參演名單已確定，載入範例會改變開幕角色，確定嗎？'))return;S.season=JSON.parse(JSON.stringify(SAMPLE_SEASON));rerender()};
 $('#sc').onclick=()=>{if(!confirm('清空當期資料？'))return;S.season=blank().season;rerender()};
}

/* ============ 匯出 / 匯入 ============ */
const stamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`};
const fileBase=()=>(S.season.name||'theatar-plan').replace(/[\/:*?"<>|]/g,'_').slice(0,40);
// 輸入名稱的小視窗
function askName(title,def,cb,okText='確定'){$('#mbox').innerHTML=`<h3>${esc(title)}</h3><div class="row"><input id="fname" value="${esc(def)}" style="flex:1;min-width:220px"></div>
 <div class="row" style="margin-top:10px"><span style="flex:1"></span><button id="mcancel">取消</button><button class="pri" id="mok">${okText}</button></div>`;
 const i=$('#fname'),ok=()=>{const v=i.value.trim();if(!v)return toast('請輸入名稱');closeModal();cb(v)};
 $('#mok').onclick=ok;$('#mcancel').onclick=closeModal;i.onkeydown=e=>{if(e.key==='Enter')ok()};$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};showModal();i.focus();i.select()}
const downloadJSON=(name,text)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=/\.json$/i.test(name)?name:name+'.json';a.click()};
// 匯出：預設檔名優先用匯入（或上次匯出）時的檔名，沒有才用「當期名稱-日期時間」
$('#exp').onclick=()=>askName('匯出全部：檔名',S.fileName?S.fileName+'.json':`${fileBase()}-${stamp()}.json`,n=>{S.fileName=n.replace(/\.json$/i,'');save();downloadJSON(n,JSON.stringify(S,null,1))},'下載');
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const j=JSON.parse(await f.text());if(!j.v)throw 0;histLabel='匯入 '+f.name;S=fix(j);S.fileName=f.name.replace(/\.json$/i,'');save();
  show(!S.seasonLocked?'season':!S.locked?'pool':'plan');toast(`已匯入「${f.name}」，可按上一步還原`)}catch{alert('檔案格式不正確')}};

show(!S.seasonLocked?'season':!S.locked?'pool':'plan');
$('#lang').value=LANG;setLang(LANG);
$('#wsbtn').onclick=openWorkspaces;paintWs();
$('#lang').onchange=e=>{setLang(e.target.value);rerender()};
</script>
</body>
</html>
